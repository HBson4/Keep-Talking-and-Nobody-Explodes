    <!-- Wires Template -->
    <template id="tpl-wires">
        <div class="module">
            <h2>Wires</h2>
            <div class="wires-container">
                <div class="color-button-group wire-count-group" style="margin-bottom: 12px; justify-content: center; display: flex; gap: 4px;">
                    <button type="button" class="wire-count-btn" data-count="3">3 Wires</button>
                    <button type="button" class="wire-count-btn" data-count="4">4 Wires</button>
                    <button type="button" class="wire-count-btn" data-count="5">5 Wires</button>
                    <button type="button" class="wire-count-btn" data-count="6">6 Wires</button>
                </div>

                <div class="dynamic-wires-container"></div>

                <div class="cWiresInfo" style="justify-content: center; margin: 15px 0;">
                    <div class="info-group">
                        <button type="button" class="serial-toggle-btn serial-odd-btn">Serial # Odd</button>
                    </div>
                </div>

                <div class="result-box" style="text-align: center; margin: 10px 0;">
                    <span style="font-weight: bold; color: #fff;">Cut: </span>
                    <span class="wire-cut-result" style="font-weight: bold; font-size: 16px; color: #07ef22;">--</span>
                </div>

                <div class="button-group">
                    <button class="btn generateBtn">Generate Results</button>
                    <button class="btn btn-secondary resetBtn">Reset</button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-morse">

            <h2>Morse Code</h2>

                <!-- Text Input Field -->
                <div class="morse-input-container">
                    <input type="text" id="morse-text-input" placeholder="Type dots/dashes here..." autocomplete="off" spellcheck="false" />
                </div>

                <!-- Matching Frequencies / Words (Displays all at once) -->
                <div class="morse-results-container" style="margin-top: 10px;">
